
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #F7F8FA; color: #1A1A1A; }
  .app { display: flex; height: 560px; border-radius: 12px; overflow: hidden; border: 0.5px solid var(--color-border-tertiary); }
  .sidebar { width: 220px; background: #fff; border-right: 0.5px solid var(--color-border-tertiary); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-logo { padding: 20px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .logo-icon { background: #0075FF; color: #fff; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .logo-text { font-weight: 700; font-size: 15px; color: #1A1A1A; }
  .nav { padding: 12px 8px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #6B7280; cursor: pointer; margin-bottom: 2px; transition: all 0.15s; }
  .nav-item:hover { background: #F3F4F6; color: #374151; }
  .nav-item.active { background: #EBF2FF; color: #0075FF; }
  .nav-item i { font-size: 16px; }
  .sidebar-footer { padding: 12px 8px; border-top: 0.5px solid var(--color-border-tertiary); }
  .user-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .user-row:hover { background: #F3F4F6; }
  .avatar-sm { width: 28px; height: 28px; border-radius: 50%; background: #EBF2FF; color: #0075FF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .user-name { font-size: 13px; font-weight: 500; color: #374151; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #F7F8FA; }
  .topbar { height: 56px; background: #fff; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; padding: 0 24px; gap: 12px; flex-shrink: 0; }
  .topbar-title { font-weight: 600; font-size: 15px; color: #1A1A1A; }
  .topbar-badge { font-size: 11px; background: #EBF2FF; color: #0075FF; padding: 3px 8px; border-radius: 20px; font-weight: 500; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 0.5px solid var(--color-border-tertiary); background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6B7280; }
  .icon-btn:hover { background: #F3F4F6; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg-row { display: flex; gap: 10px; max-width: 100%; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
  .msg-avatar.ai { background: #EBF2FF; color: #0075FF; }
  .msg-avatar.user { background: #F3F4F6; color: #6B7280; }
  .msg-body { display: flex; flex-direction: column; gap: 4px; max-width: 75%; }
  .msg-row.user .msg-body { align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; }
  .bubble.ai { background: #fff; border: 0.5px solid var(--color-border-tertiary); border-top-left-radius: 3px; color: #1A1A1A; }
  .bubble.user { background: #0075FF; color: #fff; border-top-right-radius: 3px; }
  .msg-time { font-size: 10.5px; color: #9CA3AF; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; margin-left: 38px; }
  .chip { padding: 6px 12px; background: #fff; border: 0.5px solid var(--color-border-tertiary); border-radius: 20px; font-size: 12px; color: #4B5563; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .chip:hover { border-color: #0075FF; color: #0075FF; background: #EBF2FF; }
  .thinking { display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: #fff; border: 0.5px solid var(--color-border-tertiary); border-radius: 12px; border-top-left-radius: 3px; width: fit-content; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #0075FF; animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-4px);opacity:1} }
  .input-area { padding: 12px 24px 16px; background: #F7F8FA; border-top: 0.5px solid var(--color-border-tertiary); flex-shrink: 0; }
  .input-row { display: flex; align-items: center; gap: 8px; background: #fff; border: 0.5px solid var(--color-border-tertiary); border-radius: 10px; padding: 8px 8px 8px 14px; transition: border-color 0.15s; }
  .input-row:focus-within { border-color: #0075FF; }
  .input-row input { flex: 1; border: none; outline: none; font-size: 13.5px; background: transparent; color: #1A1A1A; font-family: inherit; }
  .input-row input::placeholder { color: #9CA3AF; }
  .send-btn { width: 32px; height: 32px; border-radius: 8px; background: #0075FF; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; transition: background 0.15s; }
  .send-btn:hover { background: #005FCC; }
  .send-btn:disabled { background: #D1D5DB; cursor: default; }
  .send-btn i { font-size: 15px; }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">T</div>
      <span class="logo-text">Trackify AI</span>
    </div>
    <nav class="nav">
      <div class="nav-item active"><i class="ti ti-message-circle"></i> Chat</div>
      <div class="nav-item"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
      <div class="nav-item"><i class="ti ti-report-analytics"></i> Reports</div>
      <div class="nav-item"><i class="ti ti-folder"></i> Projects</div>
      <div class="nav-item"><i class="ti ti-users"></i> Team</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="avatar-sm">MG</div>
        <span class="user-name">Manager</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Chat Assistant</span>
      <span class="topbar-badge">Powered by Groq</span>
      <div class="topbar-right">
        <div class="icon-btn" title="Clear chat" onclick="clearChat()"><i class="ti ti-trash" style="font-size:15px"></i></div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="msg-row">
        <div class="msg-avatar ai">AI</div>
        <div class="msg-body">
          <div class="bubble ai">Hi! I'm Trackify AI. Ask me anything about your team's time logs, projects, or productivity.</div>
          <span class="msg-time">09:00</span>
        </div>
      </div>
      <div class="chips" id="chips">
        <div class="chip" onclick="sendChip(this)">Who logged most hours this week?</div>
        <div class="chip" onclick="sendChip(this)">Show idle team members</div>
        <div class="chip" onclick="sendChip(this)">List all projects</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <input type="text" id="inp" placeholder="Ask about your team..." onkeydown="if(event.key==='Enter')send()" />
        <button class="send-btn" id="send-btn" onclick="send()"><i class="ti ti-send"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
  const msgs = document.getElementById('messages');
  const inp = document.getElementById('inp');
  const btn = document.getElementById('send-btn');

  const demoReplies = {
    "who logged most hours this week?": "Based on this week's data, <strong>User3</strong> logged the most hours — 8h total. Here's the breakdown:\n\n• User3 — 8h\n• User2 — 5.5h\n• User1 — 3h",
    "show idle team members": "These team members have <strong>no time entries this week</strong>:\n\n• user4@gmail.com (member)\n• user5@gmail.com (member)\n\nConsider checking in with them.",
    "list all projects": "There are <strong>2 active projects</strong>:\n\n• Project 1 — billable, 3 members\n• Project 2 — non-billable, 2 members"
  };

  function time() {
    return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }

  function addMsg(role, text) {
    const isUser = role === 'user';
    const div = document.createElement('div');
    div.className = 'msg-row' + (isUser ? ' user' : '');
    div.innerHTML = `
      <div class="msg-avatar ${isUser?'user':'ai'}">${isUser?'You':'AI'}</div>
      <div class="msg-body">
        <div class="bubble ${isUser?'user':'ai'}">${text.replace(/\n/g,'<br>')}</div>
        <span class="msg-time">${time()}</span>
      </div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg-row'; div.id = 'typing';
    div.innerHTML = `<div class="msg-avatar ai">AI</div><div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if(t) t.remove();
  }

  function send() {
    const val = inp.value.trim();
    if(!val) return;
    document.getElementById('chips')?.remove();
    inp.value = '';
    btn.disabled = true;
    addMsg('user', val);
    showTyping();
    setTimeout(() => {
      removeTyping();
      const reply = demoReplies[val.toLowerCase()] || "I'd query your MongoDB for that. Connect the FastAPI backend at <code>/api/v1/chat</code> to get real data.";
      addMsg('ai', reply);
      btn.disabled = false;
      inp.focus();
    }, 1200);
  }

  function sendChip(el) {
    inp.value = el.textContent;
    send();
  }

  function clearChat() {
    msgs.innerHTML = '';
    addMsg('ai', 'Chat cleared. Ask me anything about your team.');
  }
</script>
